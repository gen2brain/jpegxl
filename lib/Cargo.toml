[package]
name = "jpegxl-shim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
jxl = { git = "https://github.com/libjxl/jxl-rs", rev = "041b060c9612aa3c7c194beb08a5ad931c7b6a09", default-features = false }
zune-jpegxl = { version = "0.5.2", default-features = false }
zune-core = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
